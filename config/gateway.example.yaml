server:
  enabled: true
  listen: 127.0.0.1
  port: 9080

mediamtx:
  publish_base_url: rtsp://127.0.0.1:8554
  recording:
    enabled: true
    directory: /var/lib/rk-media-gateway/recordings
    format: fmp4
    part_duration_sec: 1
    max_part_size_mb: 50
    segment_duration_sec: 3600
    delete_after_sec: 604800
    min_free_mb: 1024
    playback_listen: 127.0.0.1
    playback_port: 9996

defaults:
  probe_timeout_sec: 10
  startup_timeout_sec: 15
  progress_timeout_sec: 10
  stable_run_sec: 60
  stop_timeout_sec: 5
  max_retries: 10
  max_backoff_sec: 30

channels:
  - id: cam01
    enabled: true
    input:
      type: rtsp
      url: ${CAM01_RTSP_URL}
      transport: tcp
    video:
      decoder: h264_rkmpp
      width: 1280
      height: 720
      encoder: h264_rkmpp
      bitrate_kbps: 4000
      fps: 25
    output:
      path: cam01
